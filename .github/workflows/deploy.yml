# ============================================================
# SportShield — GitHub Actions CI/CD Pipeline
# Automated: Test → Lint → Build → Deploy
# ============================================================

name: 🛡️ SportShield — Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_REGION: us-central1
  GCP_SERVICE_NAME: sportshield-api
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/sportshield-api

jobs:

  # ── Job 1: Test & Lint ──────────────────────────────────────
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Lint with Flake8
        run: |
          flake8 backend/ ai_models/ --max-line-length=120 --ignore=E501,W503 --exclude=__pycache__

      - name: Run Tests
        env:
          DATABASE_URL: sqlite:///./test_sportshield.db
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET: test-jwt-secret-for-ci
          REDIS_URL: redis://localhost:6379/0
          UPLOAD_DIR: ./test_uploads
        run: |
          mkdir -p test_uploads
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing || true

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  # ── Job 2: Build & Push Docker Image ────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Production Docker Image
        run: |
          docker build \
            --file backend/Dockerfile \
            --target production \
            --tag $IMAGE_NAME:${{ github.sha }} \
            --tag $IMAGE_NAME:latest \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ github.sha }} \
            .

      - name: Push to Google Container Registry
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  # ── Job 3: Deploy Backend to Cloud Run ──────────────────────
  deploy-backend:
    name: 🚀 Deploy API to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $GCP_SERVICE_NAME \
            --image $IMAGE_NAME:${{ github.sha }} \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --set-env-vars "APP_ENV=production" \
            --set-secrets "SECRET_KEY=sportshield-secret-key:latest,JWT_SECRET=sportshield-jwt-secret:latest,DATABASE_URL=sportshield-db-url:latest,REDIS_URL=sportshield-redis-url:latest,GEMINI_API_KEY=sportshield-gemini-key:latest" \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe $GCP_SERVICE_NAME --region $GCP_REGION --format 'value(status.url)')
          echo "✅ Backend deployed to: $URL"
          echo "BACKEND_URL=$URL" >> $GITHUB_ENV

      - name: Smoke Test — Health Check
        run: |
          sleep 10
          curl -f "$BACKEND_URL/health" || (echo "❌ Health check failed!" && exit 1)
          echo "✅ Health check passed!"

  # ── Job 4: Deploy Frontend to Vercel ────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Production
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy \
            --prod \
            --token $VERCEL_TOKEN \
            --env NEXT_PUBLIC_API_URL=${{ env.BACKEND_URL }} \
            --build-env NEXT_PUBLIC_API_URL=${{ env.BACKEND_URL }}

  # ── Job 5: Post-Deploy Notification ─────────────────────────
  notify:
    name: 📣 Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Deployment Status
        run: |
          echo "=== SportShield Deployment Summary ==="
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Status: ${{ job.status }}"
          echo "Time: $(date -u)"
