services:
  - type: web
    name: sportshield-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/sportshield.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: APP_ENV
        value: production
      - key: CELERY_ALWAYS_EAGER
        value: "True"
    disk:
      name: sportshield-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
