# ============================================================
# SportShield — Production Docker Compose
# Full stack: API + Celery Worker + Beat + Redis + Postgres
# ============================================================

version: "3.9"

services:

  # ── PostgreSQL Database ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sportshield_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportshield}
      POSTGRES_USER: ${POSTGRES_USER:-sportshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportshield}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportshield_net

  # ── Redis (Celery Broker + Cache) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sportshield_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportshield_net

  # ── FastAPI Backend ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: sportshield_api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-sportshield}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sportshield}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sportshield_net

  # ── Celery Worker (AI Background Tasks) ─────────────────────
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: sportshield_worker
    restart: unless-stopped
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=2 --queues=default,fingerprinting,crawling
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-sportshield}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sportshield}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sportshield_net

  # ── Celery Beat (Scheduled Monitoring) ──────────────────────
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: sportshield_beat
    restart: unless-stopped
    command: celery -A backend.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-sportshield}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sportshield}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - api
      - redis
    networks:
      - sportshield_net

# ── Persistent Volumes ────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:

# ── Isolated Network ──────────────────────────────────────────
networks:
  sportshield_net:
    driver: bridge
