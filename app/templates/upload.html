{% extends "base.html" %}

{% block content %}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* Center layout */
.upload-wrapper {
    min-height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass card */
.upload-card {

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 40px;
    width: 720px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);

    animation: fadeIn 0.6s ease-in;
}

@keyframes fadeIn {
    from {
        opacity:0;
        transform: translateY(20px);
    }
    to {
        opacity:1;
        transform: translateY(0);
    }
}

/* Title */
.upload-title {
    font-size: 28px;
    font-weight: bold;
    color: black;
}

.upload-subtitle {
    color: black;
    margin-bottom: 20px;
}

/* Upload box with background image */
.upload-box {

    border: 2px dashed rgba(255,255,255,0.6);
    border-radius: 20px;
    padding: 60px 20px;
    cursor: pointer;
    transition: 0.3s;

    background:
        linear-gradient(
            rgba(255,255,255,0.6),
            rgba(255,255,255,0.6)
        ),
        url("{{ url_for('static', filename='upload_bg.png') }}");

    background-size: cover;
    background-position: center;
}

/* Hover effect */
.upload-box:hover {

    border-color: #0d6efd;
    box-shadow: 0 0 20px rgba(13,110,253,0.4);
    transform: scale(1.02);
}

/* Text */
.drag-text {
    font-size: 18px;
    font-weight: 600;
    color: black;
}

.format-text {
    color: black;
    margin-top: 5px;
}

/* Browse Button */
.browse-btn {

    background: #0d6efd;
    color: white;
    padding: 10px 25px;
    border-radius: 25px;
    margin-top: 15px;
    display: inline-block;
    transition: 0.3s;
}

.browse-btn:hover {
    background: #084298;
    transform: scale(1.05);
}

/* File name */
.file-name {
    margin-top: 10px;
    color: black;
}

/* Quote */
.upload-note {

    margin-top: 15px;
    padding: 10px;
    background: rgba(255,255,255,0.4);
    border-radius: 10px;
    font-size: 14px;
    color: black;
}

/* Buttons */
.action-btns {

    display: flex;
    justify-content: space-between;
    margin-top: 30px;
}

.back-btn {

    border-radius: 25px;
    padding: 10px 30px;
    background: rgba(255,255,255,0.6);
    text-decoration: none;
    color: black;
}

.next-btn {

    border-radius: 25px;
    padding: 10px 40px;
    background: #1fa36b;
    color: white;
    border: none;
}

.next-btn:hover {
    background: #17885a;
}

</style>

<div class="upload-wrapper">

    <div class="upload-card">

        <h2 class="upload-title">
            Upload Sports Media
        </h2>

        <p class="upload-subtitle">
            Choose a file or drag & drop it here
        </p>

        <form method="POST" enctype="multipart/form-data">

            <label class="upload-box" id="drop-area">

                <div class="drag-text">
                    Choose a file or drag & drop it here
                </div>

                <div class="format-text">
                    JPEG, PNG, PDF, MP4 up to 50MB
                </div>

                <input
                    type="file"
                    name="file"
                    id="fileInput"
                    hidden
                    required
                    onchange="showFileName(this)"
                >

                <div class="browse-btn">
                    Browse File
                </div>

            </label>

            <p id="filename" class="file-name"></p>

            <div class="upload-note">
                Secure your sports media before piracy spreads across platforms.
            </div>

            <div class="action-btns">

                <a href="/" class="back-btn">
                    Back
                </a>

                <button class="next-btn">
                    Next
                </button>

            </div>

        </form>

    </div>

</div>

<script>

/* Show file name */

function showFileName(input) {

    document.getElementById("filename").innerHTML =
        "Selected file: " + input.files[0].name;
}

/* Drag & Drop */

let dropArea = document.getElementById("drop-area");

dropArea.addEventListener("dragover", function(e) {

    e.preventDefault();

    dropArea.style.border = "2px dashed #0d6efd";
    dropArea.style.boxShadow = "0 0 20px rgba(13,110,253,0.5)";
    dropArea.style.transform = "scale(1.02)";
});

dropArea.addEventListener("dragleave", function() {

    dropArea.style.border = "2px dashed rgba(255,255,255,0.6)";
    dropArea.style.boxShadow = "none";
    dropArea.style.transform = "scale(1)";
});

dropArea.addEventListener("drop", function(e) {

    e.preventDefault();

    dropArea.style.border = "2px dashed rgba(255,255,255,0.6)";
    dropArea.style.boxShadow = "none";
    dropArea.style.transform = "scale(1)";

    let files = e.dataTransfer.files;

    document.getElementById("fileInput").files = files;

    document.getElementById("filename").innerHTML =
        "Selected file: " + files[0].name;
});

</script>

{% endblock %}
